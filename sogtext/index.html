<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="description" content="Free ASCII text art generator. Type anything and turn it into big ASCII letters in 40 styles." />
  <title>SogText — ASCII letters</title>
  <link rel="icon" href="../assets/favicon.svg?v=2" type="image/svg+xml" />
  <style>
    :root { --bg:#0b0b0b; --panel:#141414; --panel2:#1b1b1b; --line:#2a2a2a; --text:#ece7dd; --muted:#8d8880; --red:#c0141f; --red2:#e0303b; --mono:"Cascadia Mono","Consolas","DejaVu Sans Mono","Menlo","Courier New",monospace; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:13px/1.4 Arial,Helvetica,sans-serif; }
    button, input, select, textarea { color:inherit; font:inherit; }
    a { color:inherit; }
    .bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px; height:44px; padding:0 14px; border-bottom:1px solid var(--line); background:rgba(11,11,11,.94); backdrop-filter:blur(6px); }
    .brand { font-family:Georgia,serif; font-size:17px; font-style:italic; text-decoration:none; }
    .brand b { color:var(--red); font-weight:400; }
    .app-name { color:var(--muted); font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
    .bar nav { display:flex; gap:4px; margin-left:auto; }
    .bar nav a { padding:6px 10px; color:var(--muted); font-size:11px; letter-spacing:.12em; text-decoration:none; text-transform:uppercase; }
    .bar nav a:hover, .bar nav a.on { color:var(--text); }

    main { display:grid; grid-template-columns:320px minmax(0,1fr); gap:0; min-height:calc(100vh - 44px); }
    .panel { padding:18px; border-right:1px solid var(--line); background:var(--panel); }
    .panel h2 { margin:18px 0 8px; color:var(--muted); font-size:10px; font-weight:400; letter-spacing:.2em; text-transform:uppercase; }
    .panel h2:first-child { margin-top:0; }
    textarea { display:block; width:100%; min-height:84px; padding:10px; resize:vertical; border:1px solid var(--line); border-radius:3px; outline:0; background:var(--bg); font-family:var(--mono); font-size:15px; }
    textarea:focus, select:focus, input:focus { border-color:#555; }
    label.row { display:grid; grid-template-columns:96px 1fr; align-items:center; gap:10px; margin:9px 0; color:#cfc9bf; }
    select, input[type=number] { width:100%; height:30px; padding:4px 7px; border:1px solid var(--line); border-radius:3px; outline:0; background:var(--bg); }
    input[type=color] { width:100%; height:30px; padding:2px; border:1px solid var(--line); border-radius:3px; background:var(--bg); }
    .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
    .seg button { padding:6px 0; border:0; background:var(--bg); color:var(--muted); cursor:pointer; }
    .seg button + button { border-left:1px solid var(--line); }
    .seg button.on { color:var(--text); background:#2a2a2a; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:16px; }
    .btn { padding:9px 10px; border:1px solid var(--line); border-radius:3px; background:var(--panel2); cursor:pointer; text-align:center; }
    .btn:hover { border-color:#555; background:#222; }
    .btn.primary { grid-column:1 / -1; border-color:var(--red); background:var(--red); color:#fff; font-weight:700; letter-spacing:.06em; }
    .btn.primary:hover { background:var(--red2); }
    .hint { margin-top:14px; color:var(--muted); font-size:11px; }

    .stage { min-width:0; padding:22px; }
    .output-wrap { position:relative; overflow:auto; min-height:180px; padding:26px; border:1px solid var(--line); border-radius:4px; background:var(--out-bg,#0b0b0b); }
    #output { margin:0; color:var(--out-fg,#ece7dd); font-family:var(--mono); font-size:var(--fs,14px); line-height:1.12; white-space:pre; }
    .fs { display:flex; align-items:center; gap:8px; margin:10px 0 0; color:var(--muted); font-size:11px; }
    .fs input { width:160px; accent-color:var(--red); }
    .gallery-head { display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 10px; }
    .gallery-head { gap:12px; flex-wrap:wrap; align-items:center; }
    #search { width:220px; height:30px; padding:4px 9px; border:1px solid var(--line); border-radius:3px; outline:0; background:var(--panel); color:var(--text); }
    #search:focus { border-color:#555; }
    .card pre.loading { color:var(--muted); font-family:Arial, sans-serif; font-size:11px; }
    .gallery-head h2 { margin:0; color:var(--muted); font-size:10px; font-weight:400; letter-spacing:.2em; text-transform:uppercase; }
    .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; }
    .card { min-width:0; padding:10px 12px 12px; border:1px solid var(--line); border-radius:4px; background:var(--panel); cursor:pointer; text-align:left; }
    .card:hover { border-color:#555; }
    .card.on { border-color:var(--red); }
    .card span { display:block; margin-bottom:8px; color:var(--muted); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
    .card pre { margin:0; overflow:hidden; color:var(--text); font-family:var(--mono); font-size:9px; line-height:1.05; white-space:pre; }
    .toast { position:fixed; left:50%; bottom:22px; z-index:50; padding:9px 16px; border:1px solid #444; border-radius:3px; background:#1d1d1d; opacity:0; pointer-events:none; transform:translate(-50%,8px); transition:.2s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:820px) {
      main { grid-template-columns:1fr; }
      .panel { border-right:0; border-bottom:1px solid var(--line); }
      .stage { padding:14px; }
      .gallery { grid-template-columns:1fr; }
      .bar nav a:not(.on) { display:none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="../">sogz<b>'</b></a>
    <span class="app-name">SogText</span>
    <nav>
      <a href="../sogcii/">Sogcii</a>
      <a class="on" href="./">SogText</a>
      <a href="../sogsketch/">SogSketch</a>
      <a href="../sogzeditor/">Editor</a>
    </nav>
  </header>

  <main>
    <aside class="panel">
      <h2>Your text</h2>
      <textarea id="text" spellcheck="false" maxlength="400">sogz</textarea>

      <h2>Style</h2>
      <label class="row">Font <select id="font"></select></label>
      <label class="row">Spacing
        <div class="seg" id="layout">
          <button type="button" data-v="default" class="on">Normal</button>
          <button type="button" data-v="fitted">Tight</button>
          <button type="button" data-v="full">Wide</button>
        </div>
      </label>
      <label class="row">Align
        <div class="seg" id="align">
          <button type="button" data-v="left" class="on">Left</button>
          <button type="button" data-v="center">Center</button>
          <button type="button" data-v="right">Right</button>
        </div>
      </label>
      <label class="row">Border
        <select id="border">
          <option value="none">None</option>
          <option value="single">Single ┌─┐</option>
          <option value="double">Double ╔═╗</option>
          <option value="round">Rounded ╭─╮</option>
          <option value="heavy">Heavy ┏━┓</option>
          <option value="ascii">ASCII +-+</option>
          <option value="stars">Stars ***</option>
        </select>
      </label>
      <label class="row">Wrap at <input id="width" type="number" min="20" max="400" value="120" /></label>

      <h2>Image colors</h2>
      <label class="row">Text <input id="fg" type="color" value="#ece7dd" /></label>
      <label class="row">Background <input id="bg" type="color" value="#0b0b0b" /></label>

      <div class="actions">
        <button class="btn primary" type="button" id="copy">Copy text</button>
        <button class="btn" type="button" id="copyDiscord">Copy for Discord</button>
        <button class="btn" type="button" id="saveTxt">Save .txt</button>
        <button class="btn" type="button" id="savePng">Save PNG</button>
        <button class="btn" type="button" id="random">Random font</button>
      </div>
      <p class="hint">Tip: some fonts only look right in a monospace font. Use "Copy for Discord" for Discord, and Save PNG for Instagram or anywhere that changes fonts.</p>
    </aside>

    <section class="stage">
      <div class="output-wrap" id="outWrap"><pre id="output"></pre></div>
      <div class="fs">Preview size <input id="size" type="range" min="6" max="28" value="14" /></div>
      <div class="gallery-head"><h2 id="galleryTitle">All fonts — click one to use it</h2><input id="search" type="search" placeholder="Search fonts…" autocomplete="off" /></div>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script src="figlet.js"></script>
  <script src="fonts.js"></script>
  <script>
  const FONT_DATA_B64 = window.SOG_FONTS.replace(/\s+/g, "");
  (async () => {
    const $ = (id) => document.getElementById(id);
    const els = { text:$("text"), font:$("font"), width:$("width"), border:$("border"), fg:$("fg"), bg:$("bg"), output:$("output"), gallery:$("gallery"), size:$("size"), outWrap:$("outWrap") };
    const state = { layout:"default", align:"left" };

    // Unpack the bundled fonts (gzip + base64 keeps this file small).
    const bytes = Uint8Array.from(atob(FONT_DATA_B64), (c) => c.charCodeAt(0));
    const json = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    const FONTS = JSON.parse(json);
    const BUNDLED = Object.keys(FONTS);
    for (const name of BUNDLED) figlet.parseFont(name, FONTS[name]);
    // Every FIGlet font. The bundled ones load instantly; the rest come from the jsDelivr CDN when needed.
    const ALL_FONTS = ["1Row", "3-D", "3D Diagonal", "3D-ASCII", "3x5", "4Max", "5 Line Oblique", "Acrobatic", "Alligator", "Alligator2", "Alpha", "Alphabet", "AMC 3 Line", "AMC 3 Liv1", "AMC AAA01", "AMC Neko", "AMC Razor", "AMC Razor2", "AMC Slash", "AMC Slider", "AMC Thin", "AMC Tubes", "AMC Untitled", "ANSI Compact", "ANSI Regular", "ANSI Shadow", "Arrows", "ASCII 12", "ASCII 9", "ASCII New Roman", "Avatar", "B1FF", "Babyface Lame", "Babyface Leet", "Banner", "Banner3", "Banner3-D", "Banner4", "Barbwire", "Basic", "Bear", "Bell", "Benjamin", "Big", "Big ASCII 12", "Big ASCII 9", "Big Chief", "Big Money-ne", "Big Money-nw", "Big Money-se", "Big Money-sw", "Big Mono 12", "Big Mono 9", "Bigfig", "Binary", "Block", "Blocks", "Bloody", "BlurVision ASCII", "Bolger", "Braced", "Bright", "Broadway", "Broadway KB", "Bubble", "Bulbhead", "Caligraphy", "Caligraphy2", "Calvin S", "Cards", "Catwalk", "Chiseled", "Chunky", "Circle", "Classy", "Coder Mini", "Coinstak", "Cola", "Colossal", "Computer", "Contessa", "Contrast", "Cosmike", "Cosmike2", "Crawford", "Crawford2", "Crazy", "Cricket", "Cursive", "Cyberlarge", "Cybermedium", "Cybersmall", "Cygnet", "DANC4", "Dancing Font", "Decimal", "Def Leppard", "Delta Corps Priest 1", "DiamFont", "Diamond", "Diet Cola", "Digital", "Doh", "Doom", "DOS Rebel", "Dot Matrix", "Double", "Double Shorts", "Dr Pepper", "DWhistled", "Efti Chess", "Efti Font", "Efti Italic", "Efti Piti", "Efti Robot", "Efti Wall", "Efti Water", "Electronic", "Elite", "Emboss", "Emboss 2", "Epic", "Fender", "Filter", "Fire Font-k", "Fire Font-s", "Flipped", "Flower Power", "Font Font", "Four Tops", "Fraktur", "Fun Face", "Fun Faces", "Future", "Future Smooth", "Future Thin", "Fuzzy", "Georgi16", "Georgia11", "Ghost", "Ghoulish", "Glenyn", "Goofy", "Gothic", "Graceful", "Gradient", "Graffiti", "Greek", "Heart Left", "Heart Right", "Henry 3D", "Hex", "Hieroglyphs", "Hollywood", "Horizontal Left", "Horizontal Right", "ICL-1900", "Impossible", "Invita", "Isometric1", "Isometric2", "Isometric3", "Isometric4", "Italic", "Ivrit", "Jacky", "Jazmine", "Jerusalem", "JS Block Letters", "JS Bracket Letters", "JS Capital Curves", "JS Cursive", "JS Stick Letters", "Katakana", "Kban", "Keyboard", "Knob", "Konto", "Konto Slant", "Larry 3D", "Larry 3D 2", "LCD", "Lean", "Letter", "Letters", "Lil Devil", "Line Blocks", "Linguaholic Mini Block", "Linguaholic Neon", "Linguaholic Rounded", "Linguaholic Shadow 3D", "Linux", "Lockergnome", "Madrid", "Marquee", "Maxfour", "Merlin1", "Merlin2", "Mike", "Mini", "miniwi", "Mirror", "Mnemonic", "Modular", "Mono 12", "Mono 9", "Morse", "Morse2", "Moscow", "Mshebrew210", "Muzzle", "Nancyj", "Nancyj-Fancy", "Nancyj-Improved", "Nancyj-Underlined", "Nipples", "NScript", "NT Greek", "NV Script", "O8", "Octal", "Ogre", "Old Banner", "OS2", "Pagga", "Patorjk's Cheese", "Patorjk-HeX", "Pawp", "Peaks", "Peaks Slant", "Pebbles", "Pepper", "Poison", "Puffy", "Puzzle", "Pyramid", "Rammstein", "Rebel", "Rectangles", "Red Phoenix", "Relief", "Relief2", "Reverse", "Roman", "Rot13", "Rotated", "Rounded", "Rowan Cap", "Rozzo", "RubiFont", "Runic", "Runyc", "S Blood", "Santa Clara", "Script", "Serifcap", "Shaded Blocky", "Shadow", "Shimrod", "Short", "SL Script", "Slant", "Slant Relief", "Slide", "Small", "Small ASCII 12", "Small ASCII 9", "Small Block", "Small Braille", "Small Caps", "Small Isometric1", "Small Keyboard", "Small Mono 12", "Small Mono 9", "Small Poison", "Small Script", "Small Shadow", "Small Slant", "Small Tengwar", "Soft", "Speed", "Spliff", "Stacey", "Stampate", "Stampatello", "Standard", "Star Strips", "Star Wars", "Stellar", "Stforek", "Stick Letters", "Stop", "Straight", "Stronger Than All", "Sub-Zero", "Swamp Land", "Swan", "Sweet", "Tanja", "Tengwar", "Term", "Terrace", "Test1", "The Edge", "Thick", "Thin", "THIS", "Thorned", "Three Point", "Ticks", "Ticks Slant", "Tiles", "Tinker-Toy", "Tmplr", "Tombstone", "Train", "Trek", "Tsalagi", "Tubular", "Twisted", "Two Point", "Univers", "Upside Down Text", "USA Flag", "Varsity", "Wavescape", "Wavy", "Weird", "Wet Letter", "Whimsy", "WideTerm", "Wow"];
    const names = [...BUNDLED, ...ALL_FONTS.filter((n) => !BUNDLED.includes(n))];
    const FIGLET_VERSION = "1.12.0";
    const CDNS = [
      (n) => `https://cdn.jsdelivr.net/npm/figlet@${FIGLET_VERSION}/fonts/${encodeURIComponent(n)}.flf`,
      (n) => `https://unpkg.com/figlet@${FIGLET_VERSION}/fonts/${encodeURIComponent(n)}.flf`
    ];
    const loaded = new Set(BUNDLED), pending = new Map();
    const loadFont = (name) => {
      if (loaded.has(name)) return Promise.resolve(true);
      if (pending.has(name)) return pending.get(name);
      const job = (async () => {
        for (const url of CDNS) {
          try {
            const res = await fetch(url(name));
            if (!res.ok) continue;
            figlet.parseFont(name, await res.text());
            loaded.add(name); return true;
          } catch {}
        }
        return false;
      })();
      pending.set(name, job);
      job.then((ok) => { if (!ok) pending.delete(name); });
      return job;
    };

    const saved = (() => { try { return JSON.parse(localStorage.getItem("sogtext") || "{}"); } catch { return {}; } })();
    for (const name of names) els.font.add(new Option(name, name));
    els.font.value = names.includes(saved.font) ? saved.font : "ANSI Shadow";
    if (typeof saved.text === "string") els.text.value = saved.text;
    $("galleryTitle").textContent = `All ${names.length} fonts — click one to use it`;

    const render = (text, font, opts = {}) => {
      const lines = text.split("\n");
      const blocks = lines.map((line) => line.trim() === "" ? "" : figlet.textSync(line, {
        font, horizontalLayout: opts.layout || "default", verticalLayout: "default",
        width: opts.width || 120, whitespaceBreak: true
      }).replace(/\s+$/gm, "").replace(/\n+$/, ""));
      return blocks.join("\n\n");
    };

    // Align each text line as a block so the letters inside it stay lined up.
    const alignLines = (art, align) => {
      const blocks = art.split("\n\n");
      const width = (l) => [...l].length;
      const total = Math.max(0, ...art.split("\n").map(width));
      return blocks.map((block) => {
        const lines = block.split("\n");
        const bw = Math.max(0, ...lines.map(width));
        const pad = total - bw;
        const lead = align === "center" ? Math.floor(pad / 2) : align === "right" ? pad : 0;
        return lines.map((l) => (l ? " ".repeat(lead) + l : l)).join("\n");
      }).join("\n\n");
    };

    const BORDERS = {
      single:["┌","─","┐","│","└","┘"], double:["╔","═","╗","║","╚","╝"], round:["╭","─","╮","│","╰","╯"],
      heavy:["┏","━","┓","┃","┗","┛"], ascii:["+","-","+","|","+","+"], stars:["*","*","*","*","*","*"]
    };
    const addBorder = (art, kind) => {
      const b = BORDERS[kind]; if (!b) return art;
      const lines = art.split("\n");
      const w = Math.max(0, ...lines.map((l) => [...l].length));
      const out = [b[0] + b[1].repeat(w + 4) + b[2], b[3] + " ".repeat(w + 4) + b[3]];
      for (const l of lines) out.push(b[3] + "  " + l + " ".repeat(w - [...l].length) + "  " + b[3]);
      out.push(b[3] + " ".repeat(w + 4) + b[3], b[4] + b[1].repeat(w + 4) + b[5]);
      return out.join("\n");
    };

    let current = "", updateId = 0;
    const update = async () => {
      const id = ++updateId;
      if (!loaded.has(els.font.value)) {
        els.output.textContent = "Loading font…";
        const ok = await loadFont(els.font.value);
        if (id !== updateId) return;
        if (!ok) { els.output.textContent = "Couldn't load this font. Check your connection or pick another one."; return; }
      }
      const text = els.text.value || " ";
      let art = render(text, els.font.value, { layout: state.layout, width: +els.width.value || 120 });
      art = alignLines(art, state.align);
      art = addBorder(art, els.border.value);
      current = art;
      els.output.textContent = art;
      els.outWrap.style.setProperty("--out-fg", els.fg.value);
      els.outWrap.style.setProperty("--out-bg", els.bg.value);
      try { localStorage.setItem("sogtext", JSON.stringify({ font: els.font.value, text: els.text.value })); } catch {}
    };

    let galleryTimer;
    const sampleText = () => (els.text.value.split("\n")[0] || "sogz").slice(0, 14) || "sogz";
    const drawCard = async (card) => {
      const name = card.dataset.font, pre = card.querySelector("pre");
      if (!loaded.has(name)) {
        pre.className = "loading"; pre.textContent = "Loading…";
        const ok = await loadFont(name);
        if (!ok) { pre.textContent = "Couldn't load"; return; }
      }
      pre.className = "";
      try { pre.textContent = render(sampleText(), name, { width: 400 }); } catch { pre.textContent = "(this font can't draw that text)"; }
      card.dataset.drawn = sampleText();
    };
    const visible = new Set();
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) { visible.add(e.target); if (e.target.dataset.drawn !== sampleText()) drawCard(e.target); }
        else visible.delete(e.target);
      }
    }, { rootMargin: "600px 0px" });
    const buildGallery = () => {
      els.gallery.innerHTML = "";
      for (const name of names) {
        const card = document.createElement("button");
        card.type = "button"; card.dataset.font = name;
        card.className = "card" + (name === els.font.value ? " on" : "");
        const label = document.createElement("span"); label.textContent = name;
        const pre = document.createElement("pre"); pre.className = "loading"; pre.textContent = " ";
        card.append(label, pre);
        card.addEventListener("click", () => {
          els.font.value = name; update(); markGallery();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        els.gallery.appendChild(card);
        io.observe(card);
      }
    };
    const refreshGallery = () => { for (const c of visible) drawCard(c); };
    const markGallery = () => {
      for (const c of els.gallery.children) c.classList.toggle("on", c.dataset.font === els.font.value);
    };
    $("search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      for (const c of els.gallery.children) c.hidden = q && !c.dataset.font.toLowerCase().includes(q);
    });

    const toast = (msg) => {
      const t = $("toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600);
    };
    const copy = async (str, msg) => {
      try { await navigator.clipboard.writeText(str); }
      catch { const ta = document.createElement("textarea"); ta.value = str; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      toast(msg);
    };
    const download = (blob, name) => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    const fileBase = () => "sogtext-" + (els.text.value.trim().split(/\s+/)[0] || "text").replace(/[^\w-]/g, "").slice(0, 20).toLowerCase();

    const savePng = () => {
      const lines = current.split("\n");
      const fs = 28, lh = Math.round(fs * 1.12), pad = 56;
      const c = document.createElement("canvas"), ctx = c.getContext("2d");
      const font = `${fs}px ${getComputedStyle(els.output).fontFamily}`;
      ctx.font = font;
      const cw = ctx.measureText("M").width;
      const cols = Math.max(1, ...lines.map((l) => [...l].length));
      c.width = Math.ceil(cols * cw + pad * 2); c.height = Math.ceil(lines.length * lh + pad * 2);
      ctx.fillStyle = els.bg.value; ctx.fillRect(0, 0, c.width, c.height);
      ctx.font = font; ctx.fillStyle = els.fg.value; ctx.textBaseline = "top";
      lines.forEach((l, y) => [...l].forEach((ch, x) => { if (ch !== " ") ctx.fillText(ch, pad + x * cw, pad + y * lh); }));
      c.toBlob((b) => download(b, fileBase() + ".png"), "image/png");
    };

    els.text.addEventListener("input", () => { update(); clearTimeout(galleryTimer); galleryTimer = setTimeout(refreshGallery, 250); });
    for (const el of [els.font, els.width, els.border, els.fg, els.bg]) el.addEventListener("input", () => { update(); markGallery(); });
    for (const [id, key] of [["layout", "layout"], ["align", "align"]]) {
      $(id).addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        [...$(id).children].forEach((x) => x.classList.toggle("on", x === b));
        state[key] = b.dataset.v; update();
      });
    }
    els.size.addEventListener("input", () => els.output.style.setProperty("--fs", els.size.value + "px"));
    $("copy").addEventListener("click", () => copy(current, "Copied"));
    $("copyDiscord").addEventListener("click", () => copy("```\n" + current + "\n```", "Copied for Discord"));
    $("saveTxt").addEventListener("click", () => download(new Blob([current + "\n"], { type: "text/plain;charset=utf-8" }), fileBase() + ".txt"));
    $("savePng").addEventListener("click", savePng);
    $("random").addEventListener("click", () => { els.font.value = names[Math.floor(Math.random() * names.length)]; update(); markGallery(); });

    update();
    buildGallery();
  })();
  </script>
</body>
</html>
