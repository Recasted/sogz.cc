<!DOCTYPE html>
<!-- Old saved versions of a profile: archive.html?u=username. Edit them in data/members.js ("archive"). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../shared/comments.css">
  <link rel="stylesheet" href="css/social.css">
  <link rel="icon" href="images/avatars/orbit.svg" type="image/svg+xml">
  <title>OrbitSpace | Profile Archive</title>
</head>
<body data-page="archive">
<div class="page">
  <div class="content">
    <div class="box">
      <div class="box-head"><img src="images/icons/archive.svg" alt="" style="vertical-align:-3px"> <span id="archiveTitle">Profile Archive</span>
        <span class="more"><a id="archiveBack" href="index.html">« back to profile</a></span></div>
      <div class="box-body">
        <p class="small">OrbitSpace automatically saves a copy of your profile when you make big changes. Only you can delete saved versions.</p>
        <div id="archiveRoot"></div>
      </div>
    </div>
  </div>
</div>
  <!-- Load order matters: site list, then data, then the page builder. -->
  <script>window.ROOT = "../";</script>
  <script src="../shared/sites.js"></script>
  <script src="../shared/comments-config.js"></script>
  <script src="../shared/approved-comments.js"></script>
  <script src="../shared/filter.js"></script>
  <script src="../shared/comments.js"></script>
  <script src="data/members.js"></script>
  <script src="data/activity.js"></script>
  <script src="js/social.js"></script>
</body>
</html>
